<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#244c26" />
    
    <title>Savit - Mercado Saludable</title>
    <meta name="description" content="Productos naturales, keto, sin gluten y saludables. Pide por WhatsApp." />
    
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo-pwa.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      body { margin: 0; background-color: #f7fdf2; }
      #splash { 
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; 
        background-color: #244c26; color: white; display: none; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW ref failed', err));
        });
      }
    </script>
  </body>
</html>
